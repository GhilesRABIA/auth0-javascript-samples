<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton_Bees_DZ - Connexion</title>
    <script src="https://cdn.auth0.com/js/auth0/10.21.0/auth0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #loginBtn {
            background: #667eea;
            color: white;
        }
        #logoutBtn {
            background: #e74c3c;
            color: white;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐝 Bienvenue Proton_Bees_DZ</h1>
        <p>Authentification sécurisée par Auth0</p>
        <br>
        <button id="loginBtn">Se connecter</button>
        <button id="logoutBtn">Se déconnecter</button>
    </div>

    <script>
        // Configuration Auth0 avec VOS IDs
        const auth0 = new auth0.WebAuth({
            domain: 'dev-ituborkqe1.auth0.com',
            clientID: 'kN3iD3JjuZCtSHcieCqfyXyipnftxHWA',
            redirectUri: window.location.origin + '/callback.html',
            response_type: 'code',
            scope: 'openid profile email'
        });

        // Vérifier si déjà connecté
        function checkSession() {
            auth0.checkSession({}, (err, authResult) => {
                if (err || !authResult) {
                    document.getElementById('loginBtn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display = 'none';
                } else {
                    console.log('✅ Utilisateur connecté:', authResult.idTokenPayload);
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    window.location.href = 'dashboard.html';
                }
            });
        }

        // Bouton connexion
        document.getElementById('loginBtn').addEventListener('click', () => {
            auth0.authorize();
        });

        // Bouton déconnexion
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth0.logout({
                returnTo: window.location.origin + '/index.html',
                clientID: 'kN3iD3JjuZCtSHcieCqfyXyipnftxHWA'
            });
        });

        // Vérification au chargement
        checkSession();
    </script>
</body>
</html>
