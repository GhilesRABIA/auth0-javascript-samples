<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Proton_Bees_DZ - Connexion Auth0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #loginBtn {
            background: #667eea;
            color: white;
        }
        #logoutBtn {
            background: #e74c3c;
            color: white;
            display: none;
        }
    </style>
    <!-- SDK Auth0 -->
    <script src="https://cdn.auth0.com/js/auth0/10.21.0/auth0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🐝 Proton_Bees_DZ</h1>
        <p>Bienvenue sur mon site sécurisé</p>
        <br>
        <button id="loginBtn">Se connecter</button>
        <button id="logoutBtn">Se déconnecter</button>
    </div>

    <script>
        // Configuration Auth0 avec VOS informations
        const auth0 = new auth0.WebAuth({
            domain: 'dev-ituborkqe1yjnm7.us.auth0.com',
            clientID: 'kN3iD3JjuZCtSHcieCqfyXyipnftxHWA',
            redirectUri: 'http://localhost:3000/',
            responseType: 'code',
            scope: 'openid profile email'
        });

        // Vérifier si déjà connecté quand on charge la page
        auth0.checkSession({}, (err, authResult) => {
            if (err || !authResult) {
                // Pas connecté
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
            } else {
                // Déjà connecté
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                alert(`Bienvenue ${authResult.idTokenPayload.name} !`);
            }
        });

        // Bouton Se connecter
        document.getElementById('loginBtn').addEventListener('click', () => {
            auth0.authorize();
        });

        // Bouton Se déconnecter
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth0.logout({
                returnTo: 'http://localhost:3000/',
                clientID: 'kN3iD3JjuZCtSHcieCqfyXyipnftxHWA'
            });
        });
    </script>
</body>
</html>
